[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scustomtkinter"
version = "0.2.4"
authors = [
    { name = "Mark J. Hatch (AJ6CU)" }
]
description = "Themeable widgets for CustomTkinter -- tiers of buttons, labels and entries, dials, meters, tables and file choosers -- with Pygubu Designer support."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "scustomtkinter/license_morecustomtkinterwidgets.txt"]
requires-python = ">=3.10"
keywords = ["customtkinter", "tkinter", "gui", "widgets", "themes", "pygubu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Widget Sets",
]
dependencies = [
    # 6.0 is what the library is developed and tested against; it subclasses
    # CustomTkinter's widgets and uses some of their internals, so an older
    # major version is not assumed to work.
    "customtkinter>=6.0",
    "Pillow",
]

[project.optional-dependencies]
# The Pygubu Designer plugin (scustomtkinter_pygubu). The widgets themselves
# do not need it: `pip install scustomtkinter[designer]` adds it.
designer = ["pygubu", "pygubu-designer"]

[project.urls]
Homepage = "https://github.com/AJ6CU/sCustomTkinter"
Documentation = "https://github.com/AJ6CU/sCustomTkinter/tree/main/docs"
Issues = "https://github.com/AJ6CU/sCustomTkinter/issues"

[project.entry-points.'pygubu.plugins']
scustomtkinter = 'scustomtkinter_pygubu'

[tool.setuptools]
include-package-data = true

# Found, not listed: assets/ and assets/images/ hold no Python, so they are
# namespace packages, and listing only the code packages made setuptools warn
# that they "would be ignored" (they were packaged anyway, as data).
[tool.setuptools.packages.find]
include = ["scustomtkinter*"]
namespaces = true

[tool.setuptools.package-data]
"scustomtkinter.assets" = ["*.json"]
"scustomtkinter.assets.images" = ["*.png"]
