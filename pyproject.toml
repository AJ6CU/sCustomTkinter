[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scustomtkinter"
version = "0.2.0"
authors = [
    { name = "Mark J. Hatch (AJ6CU)" }
]
description = "Themeable widgets for CustomTkinter -- tiers of buttons, labels and entries, dials, meters, tables and file choosers -- with Pygubu Designer support."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "scustomtkinter/license_morecustomtkinterwidgets.txt"]
requires-python = ">=3.10"
keywords = ["customtkinter", "tkinter", "gui", "widgets", "themes", "pygubu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Widget Sets",
]
dependencies = [
    "customtkinter",
    "Pillow",
]

[project.optional-dependencies]
# The Pygubu Designer plugin (scustomtkinter_pygubu). The widgets themselves
# do not need it: `pip install scustomtkinter[designer]` adds it.
designer = ["pygubu", "pygubu-designer"]

[project.urls]
Homepage = "https://github.com/AJ6CU/sCustomTkinter"
Documentation = "https://github.com/AJ6CU/sCustomTkinter/tree/main/docs"
Issues = "https://github.com/AJ6CU/sCustomTkinter/issues"

[project.entry-points.'pygubu.plugins']
scustomtkinter = 'scustomtkinter_pygubu'

[tool.setuptools]
packages = ["scustomtkinter", "scustomtkinter_pygubu", "scustomtkinter_pygubu.designer"]
include-package-data = true

[tool.setuptools.package-data]
scustomtkinter = [
    "assets/*.json",
    "assets/images/*.png",
    "assets/images/*.ico",
]
